server {
    # nginxinc/nginx-unprivileged runs as a non-root user, so use an unprivileged
    # HTTPS port inside the container.
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # This deliberately fixed session makes the challenge self-contained. Any
    # participant can register or log in, but is still only meant to see note 2.
    location = /api/register {
        default_type application/json;
        add_header Set-Cookie "session=participant; HttpOnly; SameSite=Lax; Path=/" always;
        return 201 '{"user_id":2}';
    }

    location = /api/login {
        default_type application/json;
        add_header Set-Cookie "session=participant; HttpOnly; SameSite=Lax; Path=/" always;
        return 200 '{"user_id":2}';
    }

    location = /api/notes {
        if ($http_cookie !~* "session=participant") { return 401; }
        default_type application/json;
        return 200 '{"notes":[{"id":2,"title":"Welcome"}]}';
    }

    # Intentional IDOR: authentication is checked, but the requested object is
    # not verified to belong to the participant. The response is an HTML note,
    # so the flag exists in site content rather than in nginx configuration.
    location = /api/notes/1 {
        if ($http_cookie !~* "session=participant") { return 401; }
        alias /usr/share/nginx/html/protected/administrator-note.html;
    }

    location = /api/notes/2 {
        if ($http_cookie !~* "session=participant") { return 401; }
        default_type text/html;
        return 200 '<!doctype html><title>Welcome</title><h1>Welcome</h1><p>This is your private note.</p>';
    }

    location ~ ^/api/notes/ {
        default_type application/json;
        return 404 '{"error":"note not found"}';
    }
}
