worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type text/plain;

    # The old OpenSSL embedded in nginx handles heartbeat records.  It is
    # intentionally affected by CVE-2014-0160.
    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols       TLSv1 TLSv1.1 TLSv1.2;

        # This directive invokes the challenge module at worker start.  It is
        # not a web endpoint: it places the synthetic flag only in process
        # memory, where the vulnerable heartbeat code may disclose it.
        heartbleed_flag_seed on;

        root /usr/share/nginx/html;
        index index.html;
    }
}
